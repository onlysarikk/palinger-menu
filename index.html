    else if (q === 'en' || q === 'ru') pick = q;
    else {
      try { pick = localStorage.getItem('palinger-lang'); } catch (e) {}
      if (pick !== 'en' && pick !== 'ru') {
        var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'ru';

<style>
:root {
  --navy: #1F2C47;
  --navy-deep: #131B2D;
  --cream: #EFE9DC;
  --paper: #DCD6CA;
  --mist: #C9CFDA;
  --line: rgba(239, 233, 220, .7);
  --line-strong: rgba(239, 233, 220, .85);
  --line-frame: rgba(239, 233, 220, .8);
  --line-soft: rgba(239, 233, 220, .4);
  --dots: rgba(239, 233, 220, .55);

  --f-body: "Cormorant Garamond", Georgia, serif;
  --f-util: "Josefin Sans", "Futura", "Century Gothic", sans-serif;
  --f-date: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --f-display-en: "Old Standard TT", "Times New Roman", serif;

  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --ease-drawer: cubic-bezier(.32, .72, 0, 1);
  --ease-io: cubic-bezier(.77, 0, .175, 1);
}
html[lang="en"] {
  --f-display: "Old Standard TT", "Times New Roman", serif;
  --f-dish: "Zilla Slab", "Rockwell", Georgia, serif;
  --f-caps: var(--f-util);
  --caps-weight: 600;
}
html[lang="ru"] {
  --f-display: "Cormorant Garamond", Georgia, serif;
  --f-dish: "Bitter", Georgia, serif;
  --f-caps: "Cormorant Garamond", Georgia, serif;
  --caps-weight: 700;
}

*, *::before, *::after { box-sizing: border-box; }
html {
  background: var(--navy);
  -webkit-text-size-adjust: 100%;
  scrollbar-gutter: stable;
}
body {
  margin: 0;
  min-height: 100svh;
  background: var(--navy);
  color: var(--cream);
  font-family: var(--f-body);
  font-weight: 500;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
html.lb-lock, html.lb-lock body { overflow: hidden; }
html.lb-lock { background-color: var(--navy-deep); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--cream); outline-offset: 3px; }
.part:focus, .sec:focus { outline: none; }

/* ---------- sheet (the printed page) ---------- */
.sheet {
  position: relative;
  margin: 8px;
  padding: 18px 18px 22px;
  border: 1px solid var(--line-soft);
  min-height: calc(100svh - 16px);
}
.js .sheet { opacity: 0; }
.js.ready .sheet { opacity: 1; transition: opacity 400ms ease; }

/* ---------- language switch ---------- */
.lang { display: inline-flex; align-items: center; gap: 2px; }
.lang button {
  position: relative;
  min-width: 40px;
  height: 40px;
  padding: 0 8px;
  border: 0;
  background: none;
  cursor: pointer;
  font-family: var(--f-util);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: .22em;
  text-indent: .22em;
  color: var(--mist);
  opacity: .62;
  transition: opacity 200ms ease, color 200ms ease;
}
.lang button[aria-pressed="true"] { color: var(--cream); opacity: 1; }
.lang button::after {
  content: "";
  position: absolute;
  left: 10px; right: 10px; bottom: 9px;
  height: 1px;
  background: var(--cream);
  transform: scaleX(0);
  transition: transform 320ms var(--ease-out);
}
.lang button[aria-pressed="true"]::after { transform: scaleX(1); }
.lang-sep { width: 1px; height: 12px; background: var(--line-soft); }
@media (hover: hover) and (pointer: fine) {
  .lang button:hover { opacity: 1; }
}

/* ---------- masthead ---------- */
.halal { position: absolute; top: -6px; left: -4px; width: 62px; height: 62px; z-index: 2; }
.halal svg { display: block; width: 100%; height: 100%; }
@media (min-width: 640px) { .halal { width: 74px; height: 74px; top: -12px; left: -22px; } }
@media (min-width: 1180px) { .halal { width: 92px; height: 92px; top: -18px; left: -30px; } }

/* sold out: the row stays readable but steps back */
.dish--out .dish-name-t, .dish--out .dish-variant, .dish--out .dish-desc { opacity: .45; }
.dish--out .leader { opacity: .35; }
.price--out {
  font-family: var(--f-caps);
  font-weight: var(--caps-weight);
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--mist);
}
html[lang="ru"] .price--out { font-size: 13px; letter-spacing: .08em; }
.mast { position: relative; text-align: center; }
.lang--mast { position: absolute; top: -12px; right: -10px; z-index: 2; }
.logo {
  width: 128px;
  aspect-ratio: 540 / 570;
  margin: 26px auto 18px;
  background: var(--cream);
  -webkit-mask: var(--logo) center / contain no-repeat;
  mask: var(--logo) center / contain no-repeat;
}
.rule-1 { height: 1px; background: var(--line-strong); }
.rule-2 { height: 6px; border-top: 2px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); }
.dateline {
  display: grid;
  grid-template-columns: auto 1fr auto;   /* one line, like the printed masthead */
  grid-template-areas: "vol date est";
  align-items: baseline;
  column-gap: clamp(3px, 1.6vw, 6px);
  padding: 8px 1px 9px;
  white-space: nowrap;
  font-family: var(--f-date);
  color: var(--cream);
}
.dl-vol { grid-area: vol; text-align: left; }
.dl-est { grid-area: est; text-align: right; }
.dl-date { grid-area: date; text-align: center; font-weight: 400; font-size: clamp(8px, 2.65vw, 13px); }
.dl-vol, .dl-est { font-weight: 500; font-size: clamp(6.5px, 2.05vw, 10.5px); letter-spacing: .05em; }

.title-row { display: flex; align-items: center; gap: 18px; margin: 24px 0 0; }
.title-line { flex: 1; height: 1px; background: rgba(239, 233, 220, .5); }
.menu-title {
  margin: 0 -.38em 0 0;
  font-family: var(--f-dish);
  font-weight: 700;
  font-size: 34px;
  line-height: 1;
  letter-spacing: .38em;
}
.hint {
  margin: 12px 0 0;
  font-style: italic;
  font-size: 17px;
  color: var(--mist);
}

/* ---------- sections ---------- */
.menu { margin-top: 26px; }
.sec + .sec { margin-top: 34px; }
.sec-title {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 27px;
  line-height: 1.1;
  color: var(--cream);
}
html[lang="ru"] .sec-title { font-size: 32px; line-height: 1; }
.dbl { height: 4px; margin: 9px 0 8px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }

/* Signature box: double hairline frame, centred head */
.sig-frame {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 22px 18px 20px;
  border: 1px solid var(--line-frame);
  box-shadow: inset 0 0 0 2px var(--navy), inset 0 0 0 3px var(--line-frame);
  background: var(--navy);
}
.sig-head { text-align: center; }
.kicker {
  margin: 0 0 6px;
  font-family: var(--f-util);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .34em;
  text-indent: .34em;
  color: var(--mist);
}
.sig-frame .sec-title { font-size: 30px; }
html[lang="ru"] .sig-frame .sec-title { font-size: 35px; }
.sig-rule { height: 2px; margin: 13px 0 8px; background: rgba(239, 233, 220, .6); }
.sig-foot {
  margin: auto 0 0;
  padding-top: 20px;
  text-align: center;
  font-family: "Zilla Slab", Georgia, serif;
  font-weight: 500;
  font-size: 14px;
  letter-spacing: .3em;
  text-indent: .3em;
  color: var(--mist);
}

/* ---------- dish rows ---------- */
.dishes { list-style: none; margin: 0; padding: 0; }
.dish {
  position: relative;
  display: block;
  width: calc(100% + 20px);
  margin: 0 -10px;
  padding: 7px 10px 8px;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
  transition: transform 160ms var(--ease-out), background-color 220ms ease;
}
button.dish:active { transform: scale(.985); background-color: rgba(239, 233, 220, .055); }
.dish--static { cursor: default; }
/* Printed-menu row: the name may wrap, the price always sits on the name's LAST line,
   and the dotted leader runs from the last word to the price. */
.dish-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  column-gap: 8px;
  align-items: end;
  align-items: last baseline;
}
.dish-name {
  overflow: hidden;              /* clips the leader at the price column */
  font-family: var(--f-dish);
  font-weight: 700;
  font-size: 18.5px;
  line-height: 1.18;
  color: var(--cream);
}
html[lang="ru"] .dish-name { font-size: 17.5px; }
.leader {
  height: 2px;
  background: radial-gradient(circle, var(--dots) 0 .65px, transparent .95px) 0 50% / 4px 2px repeat-x;
}
/* inside the name: a very wide strip whose negative right margin makes it take no room in the
   line, so it stays right after the last word and is cut off where the price column starts */
.dish-name .leader.is-short { visibility: hidden; }   /* a single dot would read as a full stop */
.dish-name .leader {
  display: inline-block;
  width: 2400px;
  margin: 0 -2400px 0 0;         /* zero-width in the line: it can never wrap onto a line of its own */
  background-position: 6px 50%;  /* the gap after the last word lives inside the strip */
  vertical-align: baseline;
}
.price {
  font-family: var(--f-util);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: .02em;
  font-variant-numeric: lining-nums tabular-nums;
  color: var(--cream);
}
.dish-variant {
  display: block;
  font-variant-numeric: lining-nums;
  margin-top: 1px;
  font-style: italic;
  font-size: 15.5px;
  line-height: 1.2;
  color: var(--mist);
}
.dish-desc {
  display: block;
  margin-top: 3px;

<script>
(function () {
  'use strict';

  /* Photos: files in the "photos" folder next to this page, named by dish id
     (photos/palinger-burger.jpg …, see photos/README.txt), 4:3, at least 1200×900.
     The build marks which dishes have a photo; kitchen dishes without one open a "coming soon" card. */
  var PHOTO_DIR = 'photos/';
  var PHOTO_EXT = '.jpg';

  var UI = {
    en: {
      title: 'Palinger — Menu', menu: 'MENU', hint: 'Tap a dish to see its photo', soon: 'PHOTO COMING SOON',
      close: 'Close photo', prev: 'Previous dish', next: 'Next dish', parts: 'Menu parts',
      sections: 'Menu sections', lang: 'Language', dialog: 'Dish photo', currency: 'Prices are in Uzbek sum', soldOut: 'Sold out'
    },
    ru: {
      title: 'Palinger — Меню', menu: 'МЕНЮ', hint: 'Нажмите на блюдо — откроется фото', soon: 'ФОТО СКОРО',
      close: 'Закрыть фото', prev: 'Предыдущее блюдо', next: 'Следующее блюдо', parts: 'Части меню',
      sections: 'Разделы меню', lang: 'Язык', dialog: 'Фото блюда', currency: 'Цены указаны в сумах', soldOut: 'Нет в наличии'
    }
  };

  var root = document.documentElement;
  var DATA = JSON.parse(document.getElementById('menu-data').textContent);
  var SECTIONS = DATA.sections;
  var SEC = {};
  SECTIONS.forEach(function (s) { SEC[s.id] = s; });
  // parts of the menu (kitchen, bar); each lists its sections in page order
  var PARTS = DATA.parts;
  var PART_OF = {};
  PARTS.forEach(function (p) { p.sections.forEach(function (id) { PART_OF[id] = p; }); });
  var ORDERED = [];
  PARTS.forEach(function (p) { p.sections.forEach(function (id) { if (SEC[id]) ORDERED.push(SEC[id]); }); });

  // one entry per row on the page, in reading order; Signature dishes repeat a dish from its own section
  var DISHES = [];
  ORDERED.forEach(function (s) {
    s.items.forEach(function (id, k) {
      var d = DATA.dishes[id];
      DISHES.push({ i: DISHES.length, k: k, sec: s, part: PART_OF[s.id], id: id, photo: d.photo || false,
        price: d.price || null, variant: d.variant || null, soldOut: !!d.soldOut, en: d.en, ru: d.ru });
    });
  });
  // rows that open the photo view: every dish with a photo, plus kitchen dishes (they show a "coming soon" card)
  var VIEW = DISHES.filter(function (d) { return d.photo || d.part.placeholders; });
  VIEW.forEach(function (d, v) { d.v = v; });
  var N = VIEW.length;

  var motion = root.classList.contains('motion');
  var mqDesk = matchMedia('(min-width: 1180px)');
  var lang = root.lang === 'en' ? 'en' : 'ru';

  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  var menuEl = $('menu'), sheet = $('sheet'), indexEl = $('index'), indexScroll = $('index-scroll');
  var lb = $('lb'), rail = $('lb-rail'), stage = $('lb-stage'), ticksEl = $('ticks');
  var rows = [], slides = [], slidesLang = null;

  /* ================= menu rendering ================= */

  function dishHTML(d) {
    var t = d[lang], open = d.v !== undefined;
    var inner =
      '<span class="dish-head"><span class="dish-name"><span class="dish-name-t">' + esc(t[0]) + '</span>' +
      (d.price || d.soldOut ? '<span class="leader" aria-hidden="true"></span>' : '') + '</span>' +
      (d.soldOut ? '<span class="price price--out">' + esc(UI[lang].soldOut) + '</span>'
        : d.price ? '<span class="price">' + esc(d.price) + '</span>' : '') +
      '</span>' +
      (d.variant ? '<span class="dish-variant">' + esc(d.variant[lang]) + '</span>' : '') +
      (t[1] ? '<span class="dish-desc">' + esc(t[1]) + '</span>' : '');
    var cls = 'dish' + (d.soldOut ? ' dish--out' : '');
    return open
      ? '<li><button type="button" class="' + cls + '" data-v="' + d.v + '" aria-haspopup="dialog">' + inner + '</button></li>'
      : '<li><div class="' + cls + ' dish--static">' + inner + '</div></li>';
  }

  function dishesOf(s) {
    return DISHES.filter(function (d) { return d.sec === s; }).map(dishHTML).join('');
  }

  function sectionHTML(s) {
    if (s.signature) {
      return '<section class="sec sec--sig" id="s-' + s.id + '" aria-labelledby="h-' + s.id + '"><div class="sig-frame">' +
        '<div class="sig-head"><p class="kicker">' + esc(s.kicker) + '</p>' +
        '<h2 class="sec-title" id="h-' + s.id + '">' + esc(s.title[lang]) + '</h2></div>' +
        '<div class="sig-rule"></div><ul class="dishes">' + dishesOf(s) + '</ul>' +
        '<p class="sig-foot">' + esc(s.foot) + '</p></div></section>';
    }
    return '<section class="sec" id="s-' + s.id + '" aria-labelledby="h-' + s.id + '">' +
      '<h2 class="sec-title" id="h-' + s.id + '">' + esc(s.title[lang]) + '</h2>' +
      '<div class="dbl"></div><ul class="dishes">' + dishesOf(s) + '</ul></section>';
  }

  function partHTML(p, n) {
    // the first part sits under the masthead's MENU title; later parts (the bar) get their own title row
    var head = n === 0 ? '' :
      '<div class="part-head"><div class="rule-2"></div><div class="title-row">' +
      '<span class="title-line"></span><h2 class="part-title">' + esc(p.title[lang]) + '</h2>' +
      '<span class="title-line"></span></div></div>';
    var body;
    if (mqDesk.matches && p.desktopColumns) {
      // the printed three-column page; which sections go where is set in the menu data
      body = '<div class="cols">' + p.desktopColumns.map(function (col, c) {
        return '<div class="col' + (c === 1 ? ' col-mid' : '') + '">' +
          col.map(function (id) { return SEC[id] ? sectionHTML(SEC[id]) : ''; }).join('') + '</div>';
      }).join('') + '</div>';
    } else {
      body = p.sections.map(function (id) { return SEC[id] ? sectionHTML(SEC[id]) : ''; }).join('');
    }
    return '<div class="part part--' + p.id + '" id="p-' + p.id + '">' + head + body + '</div>';
  }

  function renderMenu() {
    menuEl.innerHTML = PARTS.map(partHTML).join('') +
      '<p class="currency">' + esc(UI[lang].currency) + '</p>';
    rows = [];
    menuEl.querySelectorAll('.dish[data-v]').forEach(function (b) { rows[+b.dataset.v] = b; });
    renderPartsNav();
    renderIndex();
    observeSections();
    tidyLeaders();
  }

  // hide a leader when not even two dots fit between the last word and the price
  function tidyLeaders() {
    menuEl.querySelectorAll('.dish-name .leader').forEach(function (l) {
      var box = l.parentNode.getBoundingClientRect(), r = l.getBoundingClientRect();
      l.classList.toggle('is-short', Math.min(r.right, box.right) - r.left - 6 < 7);
    });
  }

  function renderPartsNav() {
    var nav = $('parts-nav');
    nav.setAttribute('aria-label', UI[lang].parts);
    nav.innerHTML = PARTS.map(function (p) {
      return '<button type="button" data-target="p-' + p.id + '">' + esc(p.nav[lang]) + '</button>';
    }).join('<span class="parts-dot" aria-hidden="true">·</span>');
  }

  /* ================= language ================= */

  function langSwitchHTML() {
    return '<button type="button" data-lang="ru" lang="ru">RU</button><span class="lang-sep" aria-hidden="true"></span>' +
      '<button type="button" data-lang="en" lang="en">EN</button>';
  }

  function syncLangUI() {
    var ui = UI[lang];
    root.lang = lang;
    document.title = ui.title;
    $('menu-title').textContent = ui.menu;
    $('hint').textContent = ui.hint;
    indexEl.setAttribute('aria-label', ui.sections);
    lb.setAttribute('aria-label', ui.dialog);
    $('lb-close').setAttribute('aria-label', ui.close);
    $('lb-prev').setAttribute('aria-label', ui.prev);
    $('lb-next').setAttribute('aria-label', ui.next);
    document.querySelectorAll('[data-lang-switch]').forEach(function (g) {
      g.setAttribute('role', 'group');
      g.setAttribute('aria-label', ui.lang);
      g.querySelectorAll('button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
      });
    });
  }

  var wantLang = lang, fading = false;
  function setLang(next, opts) {
    if (next !== 'en' && next !== 'ru') return;
    opts = opts || {};
    wantLang = next;
    try { localStorage.setItem('palinger-lang', next); } catch (e) {}
    if (location.hash.slice(1) !== next) history.replaceState(history.state, '', '#' + next);
    if (fading) return;                       // the running fade applies the latest choice when it ends
    if (next === lang && !opts.force) return;
    var swap = function () {
      if (wantLang === lang && !opts.force) return;
      lang = wantLang;
      syncLangUI();
      renderMenu();
      revealAllNow();
    };
    if (!motion || opts.instant) { swap(); return; }
    fading = true;
    var out = menuEl.animate(
      [{ opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(3px)' }],
      { duration: 170, easing: 'ease-out', fill: 'forwards' }
    );
    out.onfinish = function () {
      fading = false;
      swap();
      out.cancel();
      menuEl.animate(
        [{ opacity: 0, filter: 'blur(3px)', transform: 'translateY(4px)' }, { opacity: 1, filter: 'blur(0px)', transform: 'none' }],
        { duration: 360, easing: 'cubic-bezier(.23,1,.32,1)' }
      );
    };
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-lang-switch] button');
    if (b) setLang(b.dataset.lang);
  });
  window.addEventListener('hashchange', function () {
    var h = location.hash.slice(1).toLowerCase();
    if (h === 'en' || h === 'ru') setLang(h);
  });

  /* ================= scroll reveal ================= */

  var io = null;
  function revealSection(sec, delay) {
    if (sec.classList.contains('in')) return;
    sec.classList.add('in');
    if (!motion) return;
    var parts = [sec.querySelector('.sec-title'), sec.querySelector('.dbl, .sig-rule')]
      .concat(Array.prototype.slice.call(sec.querySelectorAll('.dish')));
    parts.forEach(function (el, k) {
      if (!el) return;
      el.animate(
        [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }],
        { duration: 520, delay: (delay || 0) + k * 35, easing: 'cubic-bezier(.23,1,.32,1)', fill: 'backwards' }
      );
    });
  }
  function observeSections() {
    if (io) io.disconnect();
    var secs = menuEl.querySelectorAll('.sec');
    if (!motion || !('IntersectionObserver' in window)) {
      secs.forEach(function (s) { s.classList.add('in'); });
      return;
    }
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        io.unobserve(en.target);
        revealSection(en.target, introUntil > performance.now() ? introUntil - performance.now() : 0);
      });
    }, { rootMargin: '0px 0px -8% 0px' });
    secs.forEach(function (s) { io.observe(s); });
  }
  function revealAllNow() {
    if (io) io.disconnect();
    menuEl.querySelectorAll('.sec').forEach(function (s) { s.classList.add('in'); });
  }

  /* ================= sticky index + scrollspy ================= */

  function renderIndex() {
    indexScroll.innerHTML = PARTS.map(function (p, n) {
      return (n ? '<button type="button" class="index-part" data-target="p-' + p.id + '">' + esc(p.nav[lang]) + '</button>' : '') +
        p.sections.map(function (id) {
          return SEC[id] ? '<button type="button" data-target="s-' + id + '">' + esc(SEC[id].title[lang]) + '</button>' : '';
        }).join('');
    }).join('') + '<span class="index-ind" aria-hidden="true"></span>';
    activeSec = null;
    onScroll();
  }

  function jumpTo(e) {
    var b = e.target.closest('button[data-target]');
    if (!b) return;
    var el = $(b.dataset.target);
    if (!el) return;
    var y = el.getBoundingClientRect().top + window.scrollY - (indexEl.offsetHeight + 14);
    window.scrollTo({ top: y, behavior: motion ? 'smooth' : 'auto' });
    if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '-1');
    el.focus({ preventScroll: true });
  }
  indexScroll.addEventListener('click', jumpTo);
  $('parts-nav').addEventListener('click', jumpTo);

  var activeSec = null, ticking = false;
  function onScroll() {
    ticking = false;
    var mastBottom = $('title-row').getBoundingClientRect().bottom;
    indexEl.classList.toggle('show', mastBottom < 0 && !mqDesk.matches);
    var secs = menuEl.querySelectorAll('.sec'), cur = secs[0] ? secs[0].id : null;
    var line = Math.max(window.innerHeight * 0.38, indexEl.offsetHeight + 130);
    secs.forEach(function (s) { if (s.getBoundingClientRect().top <= line) cur = s.id; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4 && secs.length) {
      cur = secs[secs.length - 1].id;
    }
    if (cur !== activeSec) {
      activeSec = cur;
      var ind = indexScroll.querySelector('.index-ind'), on = null;
      indexScroll.querySelectorAll('button:not(.index-part)').forEach(function (b) {
        var hit = b.dataset.target === cur;
        b.classList.toggle('on', hit);
        if (hit) on = b;
      });
      if (on && ind) {
        ind.style.transform = 'translateX(' + on.offsetLeft + 'px) scaleX(' + on.offsetWidth + ')';
        var target = on.offsetLeft - (indexScroll.clientWidth - on.offsetWidth) / 2;
        indexScroll.scrollTo({ left: target, behavior: motion ? 'smooth' : 'auto' });
      }
    }
  }
  window.addEventListener('scroll', function () {
    if (!ticking) { ticking = true; requestAnimationFrame(onScroll); }
  }, { passive: true });

  /* ================= lightbox ================= */

  var cur = 0, isOpen = false, pushed = false, closing = null, openingTimer = 0;
  var canAnimate = typeof Element.prototype.animate === 'function';

  function slideHTML(d) {
    var t = d[lang];
    return '<article class="slide" data-v="' + d.v + '" aria-roledescription="slide">' +
      '<figure class="plate"><div class="plate-in' + (d.photo ? ' has-photo' : '') + '">' +
      '<div class="ph" aria-hidden="true"><span class="ph-crop"></span><span class="ph-logo"></span>' +
      '<span class="ph-cap">' + esc(UI[lang].soon) + '</span></div>' +
      (d.photo ? '<img alt="' + esc(t[0]) + '" draggable="false" decoding="async" data-src="' + PHOTO_DIR + d.id + PHOTO_EXT + '?v=' + esc(d.photo) + '">' : '') +
      '</div></figure>' +
      '<div class="meta"><h2 class="m-name" id="m-name-' + d.v + '">' + esc(t[0]) + '</h2>' +
      '<div class="m-rule"></div>' +
      (d.variant ? '<p class="m-variant">' + esc(d.variant[lang]) + '</p>' : '') +
      (t[1] ? '<p class="m-desc">' + esc(t[1]) + '</p>' : '') +
      (d.price ? '<p class="m-price"><span class="leader" aria-hidden="true"></span><b>' + esc(d.price) + '</b></p>' : '') +
      '</div></article>';
  }

  function buildSlides() {
    if (slidesLang === lang) return;
    rail.innerHTML = VIEW.map(slideHTML).join('');
    slides = Array.prototype.slice.call(rail.children);
    slidesLang = lang;
    $('lb-total').textContent = pad(N);
    ticksEl.innerHTML = VIEW.map(function (d, v) {
      return '<i' + (v > 0 && VIEW[v - 1].sec !== d.sec ? ' class="gap"' : '') + '></i>';
    }).join('');
  }

  function loadPhoto(i) {
    var s = slides[i];
    if (!s) return;
    var img = s.querySelector('img');
    if (!img || img.dataset.state) return;
    img.dataset.state = 'loading';
    img.onload = function () { img.dataset.state = 'ok'; img.classList.add('ok'); };
    img.onerror = function () { img.dataset.state = 'none'; img.parentNode.classList.remove('has-photo'); img.remove(); };
    img.src = img.dataset.src;
  }

  function railTo(i, animate) {
    rail.style.transition = animate ? 'transform 520ms cubic-bezier(.32,.72,0,1)' : 'none';
    rail.style.transform = 'translate3d(' + (-i * 100) + '%,0,0)';
  }

  function go(i, animate) {
    i = Math.max(0, Math.min(N - 1, i));
    cur = i;
    railTo(i, animate !== false && motion);
    var d = VIEW[i];
    $('lb-cur').textContent = pad(i + 1);
    $('lb-sec').textContent = d.sec.title[lang];
    var focused = document.activeElement;
    $('lb-prev').disabled = i === 0;
    $('lb-next').disabled = i === N - 1;
    if (focused && focused.disabled) (N > 1 ? (focused.id === 'lb-next' ? $('lb-prev') : $('lb-next')) : $('lb-close')).focus();
    lb.setAttribute('aria-labelledby', 'm-name-' + i);
    slides.forEach(function (s, k) {
      var on = k === i;
      s.classList.toggle('is-current', on);
      s.setAttribute('aria-hidden', String(!on));
      if ('inert' in s) s.inert = !on;
    });
    Array.prototype.forEach.call(ticksEl.children, function (t, k) { t.classList.toggle('on', k === i); });
    [i, i + 1, i - 1, i + 2].forEach(loadPhoto);
    if (!lb.classList.contains('pre')) develop(i);
  }

  function develop(i) {
    var s = slides[i];
    if (s && !s.classList.contains('dev')) requestAnimationFrame(function () { s.classList.add('dev'); });
  }

  function insetFor(el) {
    var r = el.getBoundingClientRect(), w = window.innerWidth, h = window.innerHeight;
    var t = Math.max(0, r.top), b = Math.max(0, h - r.bottom);
    return 'inset(' + t + 'px ' + Math.max(0, w - r.right) + 'px ' + b + 'px ' + Math.max(0, r.left) + 'px)';
  }

  function stopLbAnimations() {
    if (typeof lb.getAnimations === 'function') lb.getAnimations().forEach(function (a) { a.cancel(); });
    closing = null;
  }

  function open(i, fromRow) {
    if (isOpen) return;
    stopLbAnimations();
    buildSlides();
    isOpen = true;
    lb.hidden = false;
    lb.classList.remove('leaving');
    lb.style.transform = '';
    root.classList.add('lb-lock');
    sheet.inert = true;
    indexEl.inert = true;
    slides.forEach(function (s) { s.classList.remove('dev'); });
    lb.classList.add('pre', 'opening');
    clearTimeout(openingTimer);
    openingTimer = setTimeout(function () { lb.classList.remove('opening'); }, 450);
    go(i, false);

    if (motion && fromRow) {
      lb.animate([{ clipPath: insetFor(fromRow) }, { clipPath: 'inset(0px 0px 0px 0px)' }],
        { duration: 640, easing: 'cubic-bezier(.32,.72,0,1)' });
    } else if (canAnimate) {
      lb.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease-out' });
    }
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        lb.classList.remove('pre');
        develop(cur);
      });
    });
    history.pushState({ palingerPhoto: true }, '', location.href);
    pushed = true;
    $('lb-close').focus({ preventScroll: true });
  }

  function requestClose() {
    if (!isOpen) return;
    if (pushed) { pushed = false; history.back(); } else { close(); }  // popstate then runs close()
  }

  function close() {
    if (!isOpen) return;
    isOpen = false;
    pushed = false;
    drag = null;
    clearTimeout(openingTimer);
    lb.classList.remove('opening');
    var row = rows[cur];
    // bring the dish we are returning to into view, behind the overlay
    if (row) {
      var r = row.getBoundingClientRect(), top = indexEl.offsetHeight + 8;
      if (r.top < top || r.bottom > window.innerHeight - 8) {
        window.scrollTo(0, window.scrollY + r.top - window.innerHeight * 0.42);
        onScroll();
      }
    }
    var dragged = lb.style.transform || 'none';
    stopLbAnimations();
    var finish = function () {
      lb.hidden = true;
      stopLbAnimations();
      lb.classList.remove('leaving');
      lb.style.transform = '';
      lb.style.transition = '';
      root.classList.remove('lb-lock');
      sheet.inert = false;
      indexEl.inert = false;
      if (row) {
        row.focus({ preventScroll: true });
        row.classList.remove('flash');
        void row.offsetWidth;
        row.classList.add('flash');
      }
    };
    if (motion && row) {
      lb.classList.add('leaving');
      closing = lb.animate(
        [{ clipPath: 'inset(0px 0px 0px 0px)', transform: dragged }, { clipPath: insetFor(row), transform: 'none' }],
        { duration: 420, easing: 'cubic-bezier(.77,0,.175,1)', fill: 'forwards' }
      );
      closing.onfinish = finish;
    } else {
      finish();
    }
  }

  window.addEventListener('popstate', function () { if (isOpen) { pushed = false; close(); } });

  menuEl.addEventListener('click', function (e) {
    var b = e.target.closest('.dish[data-v]');
    if (b) open(+b.dataset.v, b);
  });
  $('lb-close').addEventListener('click', requestClose);
  $('lb-prev').addEventListener('click', function () { go(cur - 1); });
  $('lb-next').addEventListener('click', function () { go(cur + 1); });

  document.addEventListener('keydown', function (e) {
    if (!isOpen) return;
    if (e.key === 'Escape') { e.preventDefault(); requestClose(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'Tab') {
      var f = Array.prototype.filter.call(lb.querySelectorAll('button'), function (b) { return !b.disabled; });
      var k = f.indexOf(document.activeElement);
      e.preventDefault();
      f[(k + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  });

  /* ---- gestures: swipe sideways to change dish, pull down to close ---- */
  var drag = null;
  stage.addEventListener('pointerdown', function (e) {
    if (drag || !e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: performance.now(), dx: 0, dy: 0, axis: null, w: stage.clientWidth };
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  });
  stage.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag.dx = e.clientX - drag.x0;
    drag.dy = e.clientY - drag.y0;
    if (!drag.axis) {
      if (Math.abs(drag.dx) < 8 && Math.abs(drag.dy) < 8) return;
      drag.axis = Math.abs(drag.dx) > Math.abs(drag.dy) ? 'x' : 'y';
      rail.style.transition = 'none';
      lb.style.transition = 'none';
    }
    if (drag.axis === 'x') {
      var dx = drag.dx;
      if ((cur === 0 && dx > 0) || (cur === N - 1 && dx < 0)) dx = dx / (1 + Math.abs(dx) / 140);
      rail.style.transform = 'translate3d(calc(' + (-cur * 100) + '% + ' + dx + 'px),0,0)';
    } else {
      var dy = drag.dy > 0 ? drag.dy : drag.dy / (1 + Math.abs(drag.dy) / 40);
      var s = 1 - Math.min(Math.max(dy, 0) / 1800, 0.1);
      lb.style.transform = 'translate3d(0,' + dy + 'px,0) scale(' + s + ')';
    }
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag;
    drag = null;
    var dt = Math.max(1, performance.now() - d.t0);
    if (e.type === 'pointerup') {
      // trust where the finger left the screen, not the last (possibly coalesced) move event
      d.dx = e.clientX - d.x0;
      d.dy = e.clientY - d.y0;
      if (!d.axis && (Math.abs(d.dx) > 24 || Math.abs(d.dy) > 24)) d.axis = Math.abs(d.dx) > Math.abs(d.dy) ? 'x' : 'y';
    }
    if (e.type !== 'pointerup') {  // cancelled by the system (edge-swipe back, incoming call…): snap back
      if (d.axis === 'x') go(cur, true);
      lb.style.transition = 'transform 300ms cubic-bezier(.32,.72,0,1)';
      lb.style.transform = '';
      return;
    }
    if (d.axis === 'x') {
      var v = Math.abs(d.dx) / dt, next = cur;
      if (Math.abs(d.dx) > d.w * 0.18 || (v > 0.3 && Math.abs(d.dx) > 20)) next = cur + (d.dx < 0 ? 1 : -1);
      go(next, true);
    } else if (d.axis === 'y') {
      if (d.dy > 110 || (d.dy / dt > 0.5 && d.dy > 30)) {
        requestClose();
      } else {
        lb.style.transition = 'transform 420ms cubic-bezier(.32,.72,0,1)';
        lb.style.transform = '';
      }
    }
  }
  stage.addEventListener('dragstart', function (e) { e.preventDefault(); });
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('lostpointercapture', endDrag);

  /* ================= boot ================= */

  var introUntil = 0;
  function boot() {
    document.querySelectorAll('[data-lang-switch]').forEach(function (g) { g.innerHTML = langSwitchHTML(); });
    syncLangUI();
    renderMenu();
    if (location.hash.slice(1) !== lang) history.replaceState(null, '', '#' + lang);
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    mqDesk.addEventListener('change', function () {
      var top = indexEl.offsetHeight;
      var anchor = Array.prototype.find.call(menuEl.querySelectorAll('.sec'), function (sec) {
        return sec.getBoundingClientRect().bottom > top;
      });
      var offset = anchor ? anchor.getBoundingClientRect().top : 0;
      renderMenu();
      revealAllNow();
      var again = anchor && $(anchor.id);
      if (again) window.scrollTo(0, window.scrollY + again.getBoundingClientRect().top - offset);
    });
    // web fonts change text widths: re-measure the index underline when they arrive
    if (document.fonts && document.fonts.addEventListener) {
      document.fonts.addEventListener('loadingdone', function () { activeSec = null; onScroll(); tidyLeaders(); });
    }
    var tidyQueued = false;
    window.addEventListener('resize', function () {
      if (!ticking) { ticking = true; requestAnimationFrame(onScroll); }
      if (!tidyQueued) { tidyQueued = true; requestAnimationFrame(function () { tidyQueued = false; tidyLeaders(); }); }
    });

    var start = function () {
      if (root.classList.contains('ready') && root.dataset.started) return;
      root.dataset.started = '1';
      root.classList.add('ready');
      if (!motion) return;
      introUntil = performance.now() + 650;
      intro();
    };
    var link = document.getElementById('webfonts');
    var sheetLoaded = new Promise(function (r) {
      if (!link || link.media === 'all') { r(); return; }
      link.addEventListener('load', r);
      link.addEventListener('error', r);
    });
    var fontsLoaded = sheetLoaded.then(function () {
      if (!document.fonts || !document.fonts.load) return null;
      var faces = lang === 'ru'
        ? ['700 18px Bitter', '700 30px "Cormorant Garamond"']
        : ['700 18px "Zilla Slab"', '700 30px "Old Standard TT"'];
      faces.push('500 16px "Cormorant Garamond"', '600 12px "Josefin Sans"', '400 13px "Libre Franklin"');
      return Promise.all(faces.map(function (f) { return document.fonts.load(f); }));
    });
    Promise.race([fontsLoaded, new Promise(function (r) { setTimeout(r, 1300); })]).then(start, start);
  }

  function intro() {
    var ease = 'cubic-bezier(.23,1,.32,1)';
    var logo = document.querySelector('.logo');
    logo.animate([
      { clipPath: 'circle(0% at 50% 38%)', transform: 'scale(1.06)', filter: 'blur(3px)' },
      { clipPath: 'circle(80% at 50% 38%)', transform: 'none', filter: 'blur(0px)' }
    ], { duration: 1150, easing: ease, fill: 'backwards' });
    document.querySelectorAll('.mast .draw').forEach(function (el, k) {
      el.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }],
        { duration: 900, delay: 260 + k * 70, easing: 'cubic-bezier(.77,0,.175,1)', fill: 'backwards' });
    });
    document.querySelector('.dateline').animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }],
      { duration: 700, delay: 480, easing: ease, fill: 'backwards' });
    $('menu-title').animate([{ opacity: 0, letterSpacing: '.9em' }, { opacity: 1, letterSpacing: '.38em' }],
      { duration: 1000, delay: 560, easing: ease, fill: 'backwards' });
    $('hint').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, delay: 900, easing: 'ease-out', fill: 'backwards' });
    document.querySelectorAll('.lang--mast').forEach(function (el) {
      el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 600, delay: 900, fill: 'backwards' });
    });
    // hint that rows open: a soft light passes once over the first dish
    setTimeout(function () {
      var first = rows[0];
      if (!first || isOpen) return;
      var r = first.getBoundingClientRect();
      if (r.top < window.innerHeight && r.bottom > 0) {
        first.classList.add('cue');
        setTimeout(function () { first.classList.remove('cue'); }, 1600);
      }
    }, 1900);
  }

  boot();
})();
